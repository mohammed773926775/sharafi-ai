name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Extract ZIP
      run: |
        unzip *.zip -d extracted_project
        echo "ZIP extracted successfully"

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: |
        cd extracted_project
        # Find the gradlew file if it exists and make it executable
        if [ -f "gradlew" ]; then chmod +x gradlew; fi

    - name: Build with Gradle
      run: |
        cd extracted_project
        # Build the debug APK
        if [ -f "gradlew" ]; then
          ./gradlew assembleDebug
        else
          gradle wrapper
          ./gradlew assembleDebug
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: SHARAFI-AI-APK
        path: extracted_project/app/build/outputs/apk/debug/*.apk
