name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Extract ZIP
      run: |
        unzip *.zip -d extracted_project

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Fix Keystore and Firebase
      run: |
        cd extracted_project
        keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        sed -i '/com.google.gms.google-services/d' app/build.gradle.kts

    - name: Force Samsung Engines (STT)
      run: |
        cd extracted_project
        grep -rl "com.google.android.googlequicksearchbox" app/src/main/java/ | xargs -r sed -i 's/com.google.android.googlequicksearchbox/com.samsung.android.svoice/g'
        if ! grep -q "com.samsung.android.svoice" app/src/main/AndroidManifest.xml; then
          sed -i '/<application/i \    <queries>\n        <package android:name="com.samsung.android.svoice" />\n    </queries>' app/src/main/AndroidManifest.xml
        fi

    - name: Add Offline TTS Library
      run: |
        cd extracted_project
        # إضافة مكتبة النطق المحلي إلى Gradle
        if ! grep -q "com.github.TeamNewPipe:NewPipeExtractor" app/build.gradle.kts; then
          sed -i 's/dependencies {/dependencies {\n    implementation("com.github.alphacep:vosk-android:0.3.47")/' app/build.gradle.kts
        fi
        # إضافة مستودع JitPack
        if ! grep -q "jitpack.io" settings.gradle.kts; then
          sed -i 's/mavenCentral()/mavenCentral()\n        maven { url = uri("https:\/\/jitpack.io") }/' settings.gradle.kts
        fi

    - name: Build APK
      run: |
        cd extracted_project
        gradle wrapper
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: SHARAFI-AI-APK-V4
        path: extracted_project/app/build/outputs/apk/debug/*.apk
