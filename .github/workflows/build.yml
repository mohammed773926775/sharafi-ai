name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Extract ZIP
      run: |
        unzip *.zip -d extracted_project

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Fix Keystore and Firebase
      run: |
        cd extracted_project
        keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        sed -i '/com.google.gms.google-services/d' app/build.gradle.kts

    - name: Modify STT Engine (Force Samsung)
      run: |
        cd extracted_project
        # البحث عن ملف المحرك واستبدال محرك جوجل بمحرك سامسونج
        if [ -f "app/src/main/java/com/sharafi/offlineassistant/speech/OfflineSpeechEngine.kt" ]; then
          sed -i 's/com.google.android.googlequicksearchbox/com.samsung.android.svoice/g' app/src/main/java/com/sharafi/offlineassistant/speech/OfflineSpeechEngine.kt
        fi
        # إذا كان المسار مختلفاً، سنبحث في كل الملفات لضمان التعديل
        grep -rl "com.google.android.googlequicksearchbox" app/src/main/java/ | xargs -r sed -i 's/com.google.android.googlequicksearchbox/com.samsung.android.svoice/g'

    - name: Build APK
      run: |
        cd extracted_project
        gradle wrapper
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: SHARAFI-AI-APK-Samsung
        path: extracted_project/app/build/outputs/apk/debug/*.apk
