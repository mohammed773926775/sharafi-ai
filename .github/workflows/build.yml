name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Extract ZIP
      run: |
        unzip *.zip -d extracted_project

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Fix Keystore and Firebase
      run: |
        cd extracted_project
        keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        sed -i '/com.google.gms.google-services/d' app/build.gradle.kts

    - name: Force Samsung Engines & Fix Arabic TTS
      run: |
        cd extracted_project
        
        # 1. إصلاح محرك الاستماع (STT) ليستخدم سامسونج
        grep -rl "com.google.android.googlequicksearchbox" app/src/main/java/ | xargs -r sed -i 's/com.google.android.googlequicksearchbox/com.samsung.android.svoice/g'
        
        # 2. إصلاح محرك النطق (TTS) ليستخدم محرك النظام الافتراضي (eSpeak) الذي يدعم العربية
        # البحث عن أي إشارة لمحرك جوجل TTS واستبدالها بالمحرك الافتراضي
        grep -rl "com.google.android.tts" app/src/main/java/ | xargs -r sed -i 's/com.google.android.tts//g'
        
        # 3. إضافة صلاحيات الاستعلام في المانيفست
        if ! grep -q "com.samsung.android.svoice" app/src/main/AndroidManifest.xml; then
          sed -i '/<application/i \    <queries>\n        <package android:name="com.samsung.android.svoice" />\n        <intent>\n            <action android:name="android.intent.action.TTS_SERVICE" />\n        </intent>\n    </queries>' app/src/main/AndroidManifest.xml
        fi

    - name: Build APK
      run: |
        cd extracted_project
        gradle wrapper
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: SHARAFI-AI-APK-Final
        path: extracted_project/app/build/outputs/apk/debug/*.apk
