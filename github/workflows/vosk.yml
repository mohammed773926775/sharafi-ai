name: Build Vosk Demo

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Download Vosk Source
      run: |
        curl -L -o vosk.zip https://github.com/alphacep/vosk-android-demo/archive/refs/heads/master.zip
        unzip vosk.zip

    - name: Download Arabic Model
      run: |
        curl -L -o model.zip https://alphacephei.com/vosk/models/vosk-model-small-ar-0.3.zip
        unzip model.zip -d vosk-android-demo-master/app/src/main/assets/
        mv vosk-android-demo-master/app/src/main/assets/vosk-model-small-ar-0.3 vosk-android-demo-master/app/src/main/assets/model-ar

    - name: Download English Model
      run: |
        curl -L -o model-en.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
        unzip model-en.zip -d vosk-android-demo-master/app/src/main/assets/
        mv vosk-android-demo-master/app/src/main/assets/vosk-model-small-en-us-0.15 vosk-android-demo-master/app/src/main/assets/model-en

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build APK
      run: |
        cd vosk-android-demo-master
        gradle wrapper
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Vosk-Demo-APK
        path: vosk-android-demo-master/app/build/outputs/apk/debug/*.apk
